font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
enable_audio_bell no
font_size 9.0
window_padding_width 5

# Tab bar - vuông, phẳng
tab_bar_style                 separator
tab_separator                 " ┃"
tab_bar_min_tabs              1
tab_bar_edge                  bottom
tab_bar_margin_width          0
tab_bar_margin_height         0 5
active_tab_font_style         bold
inactive_tab_font_style       normal
tab_title_template            " {title} "
tab_bar_align                 left
tab_bar_background            #11111b

include theme.conf
cursor_trail 1
#background_opacity 0.60
#hide_window_decorations yes
#confirm_os_window_close 0

# initially empty, to be configured by user and remains static
include userprefs.conf

# Note: as userprefs.conf is included at the end, settings configured in this file will override the defaults
