# name "End-4"
# credit https://github.com/end-4/dots-hyprland

animations {
    enabled = true
    
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    
    animation = windows, 1, 3, md3_decel, popin 80%
    animation = windowsIn, 1, 3, md3_decel, popin 80%
    animation = windowsOut, 1, 2, md3_accel, popin 80%
    animation = windowsMove, 1, 3, md3_decel, slide
    
    animation = border, 1, 3, easeOutQuint
    animation = fade, 1, 3, easeOutQuint
    
    animation = workspaces, 1, 3, easeOutQuint, slide
    
    animation = layers, 1, 3, md3_decel, slide
    animation = layersIn, 1, 3, md3_decel, slide
    animation = layersOut, 1, 2, md3_accel, slide
}
