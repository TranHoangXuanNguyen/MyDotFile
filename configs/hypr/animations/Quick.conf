# Quick preset for 60 Hz / integrated graphics. Speeds are in 100 ms units.
animations {
    enabled = true
    bezier = quickOut, 0.22, 1, 0.36, 1
    bezier = quickIn, 0.4, 0, 1, 1

    animation = windows, 1, 1.8, quickOut, popin 97%
    animation = windowsOut, 1, 1.2, quickIn, popin 98%
    animation = windowsMove, 1, 1.5, quickOut
    animation = fade, 1, 1.4, quickOut
    animation = border, 0
    animation = borderangle, 0
    animation = workspaces, 1, 2, quickOut, slidefade 15%
    animation = specialWorkspace, 1, 1.8, quickOut, slidefade 10%
    animation = layers, 1, 1.5, quickOut, fade
    animation = layersOut, 1, 1.2, quickIn, fade
}
