# Tinh chỉnh lại bởi Gemini cho Nguyên (IkiGuyZ) - Laptop Resolution Optimized

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 1 # Để 1 cho nhẹ máy
    immediate_render = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgb(0,0,0)
    blur_size = 4
    blur_passes = 3
    brightness = 0.5 # Cho tối xuống tí để nổi chữ
}

# 1. HOUR - Giờ (Thu nhỏ lại từ 130 xuống 80)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = $color8
    font_size = 80 
    font_family = JetBrainsMono Nerd Font ExtraBold 
    position = 0, 150 # Đưa lên cao một chút
    halign = center
    valign = center
}

# 2. DATE - Ngày tháng (Thu nhỏ và dời xuống dưới Giờ)
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
    color = $color13
    font_size = 24 # Giảm từ 48 xuống 24 cho thanh thoát
    font_family = Victor Mono Bold Italic
    position = 0, 60
    halign = center
    valign = center
}

# 3. INPUT FIELD - Ô nhập mật khẩu (Thu nhỏ kích thước)
input-field {
    monitor =
    size = 200, 50 # Giảm từ 230x70 xuống 200x50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $color8
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $color13
    fade_on_empty = false
    placeholder_text = <i>🔒 Password...</i>
    position = 0, -50 # Đưa xuống dưới tâm màn hình
    halign = center
    valign = center
}

# 4. USER - Tên người dùng
label {
    monitor =
    text =   $USER
    color = $color13
    font_size = 18
    font_family = Victor Mono Bold Oblique
    position = 0, -110
    halign = center
    valign = center
}

# 5. UPTIME & BATTERY (Gom gọn vào góc dưới bên phải)
label {
    monitor =
    text = cmd[update:60000] echo "<b> $($Scripts/Battery.sh) | $(uptime -p) </b>"
    color = $color8
    font_size = 12
    font_family = Victor Mono Bold Oblique
    position = -20, 20
    halign = right
    valign = bottom
}